name: Build HQ Screen Assets

on:
  push:
    paths:
      - '.github/workflows/upscale.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libheif1 webp

      - name: Generate high quality WebP screens
        run: |
          set -e
          for i in 1 2 3 4 5 6 7; do
            convert "assets/screens/screen${i}.avif" \
              -filter Lanczos \
              -resize 400% \
              -unsharp 0x1.1+0.9+0.02 \
              -quality 96 \
              "assets/screens/screen${i}-hq.webp"
          done
          identify assets/screens/*-hq.webp

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screens/*-hq.webp
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generate HQ screen assets"
          git push
