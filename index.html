<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For You ♡</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{background:#160c1c;font-family:Arial,sans-serif;display:grid;place-items:center}.app{width:min(100vw,430px);height:100dvh;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.game{position:relative;width:100%;height:100%;overflow:hidden;border-radius:24px;background:#8977dd;box-shadow:0 18px 55px #0008}.screen{position:absolute;inset:0;padding:16px;opacity:0;pointer-events:none;transform:translateX(16px);transition:.35s ease;overflow:hidden;background:linear-gradient(#746fd1 0 32%,#a27fdf 58%,#ef88b8 100%)}.screen.active{opacity:1;pointer-events:auto;transform:none}.stars{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 13%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 28% 6%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 71% 18%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 89% 9%,#fff 0 2px,transparent 2.5px),radial-gradient(circle at 56% 27%,#fff 0 1px,transparent 1.6px);opacity:.95}.cloud{position:absolute;background:#fff9f6;border-radius:4px;box-shadow:0 6px 0 #e9e0f2}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.c1{width:120px;height:26px;left:-10px;top:130px}.c1:before{width:44px;height:44px;left:18px;top:-20px}.c1:after{width:62px;height:62px;left:50px;top:-34px}.c2{width:150px;height:30px;right:-16px;bottom:150px}.c2:before{width:48px;height:48px;left:14px;top:-22px}.c2:after{width:68px;height:68px;left:55px;top:-38px}.c3{width:90px;height:24px;left:20px;bottom:190px}.c3:before{width:34px;height:34px;left:7px;top:-16px}.c3:after{width:48px;height:48px;left:30px;top:-26px}.hud{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center}.life{display:flex;gap:4px}.ph{width:15px;height:14px;background:#ff5e79;clip-path:polygon(50% 100%,0 48%,0 20%,20% 0,50% 18%,80% 0,100% 20%,100% 48%);filter:drop-shadow(1px 1px 0 #47304c)}.ph.off{background:#ffdce7}.pixbtn{font:9px 'Press Start 2P',monospace;color:#fff;background:#f379aa;border:2px solid #5e3558;border-radius:4px;padding:9px 10px;box-shadow:0 4px 0 #9e4f7d;cursor:pointer}.pixbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #9e4f7d}.title{position:relative;z-index:4;font:19px/1.55 'Press Start 2P',monospace;color:#ffc0d7;text-align:right;text-shadow:2px 2px 0 #7b3a69,-1px -1px 0 #7b3a69}.title small{display:block;font-size:9px;color:#ffe0ec;margin-bottom:10px}.start-layout{height:calc(100% - 36px);display:flex;flex-direction:column;justify-content:space-between;padding:30px 2px 76px;position:relative;z-index:4}.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.startbtn{align-self:center;font:10px 'Press Start 2P',monospace;background:#f887b3;color:#fff;border:3px solid #743b69;border-radius:5px;padding:12px 18px;box-shadow:0 5px 0 #9d4c7b;cursor:pointer}.note{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 34px);z-index:6;text-align:center;background:#fffdeedb;color:#9e6984;border-radius:999px;padding:11px;font-weight:700;font-size:13px}.boy{position:relative;width:105px;height:140px;flex:0 0 auto;animation:bob 2.2s ease-in-out infinite;image-rendering:pixelated}@keyframes bob{50%{transform:translateY(-5px)}}.boy.big{width:130px;height:170px}.hairback{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:62px;height:65px;background:#251b1a;border:3px solid #4a2d34;border-radius:46% 46% 42% 42%}.head{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:52px;height:52px;background:#f5cdbb;border:3px solid #503039;border-radius:48% 48% 45% 45%;z-index:2}.eye{position:absolute;top:25px;width:6px;height:7px;background:#543b30;border-radius:50%;box-shadow:inset 0 0 0 2px #8a674f}.eye.l{left:11px}.eye.r{right:11px}.cheek{position:absolute;top:34px;width:10px;height:5px;background:#ef9cae66;border-radius:50%}.cheek.l{left:4px}.cheek.r{right:4px}.smile{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:12px;height:6px;border-bottom:2px solid #9a6571;border-radius:50%}.curl{position:absolute;background:#211817;border:3px solid #4a2d34;border-radius:50%;z-index:3}.u1{width:27px;height:27px;left:18px;top:4px}.u2{width:29px;height:29px;left:39px;top:0}.u3{width:27px;height:27px;right:18px;top:5px}.u4{width:25px;height:25px;left:12px;top:25px}.u5{width:25px;height:25px;right:12px;top:25px}.fringe{position:absolute;z-index:4;left:50%;top:17px;transform:translateX(-50%);width:55px;height:28px}.fringe i{position:absolute;width:14px;height:28px;background:#211817;border-radius:10px}.fringe i:nth-child(1){left:5px;transform:rotate(-18deg)}.fringe i:nth-child(2){left:20px;top:-5px}.fringe i:nth-child(3){right:5px;transform:rotate(18deg)}.torso{position:absolute;left:50%;top:69px;transform:translateX(-50%);width:55px;height:42px;background:#f7fbff;border:3px solid #51445d;border-radius:8px;z-index:1}.tie{position:absolute;left:50%;top:73px;transform:translateX(-50%);width:8px;height:19px;background:#405a87;clip-path:polygon(50% 0,100% 35%,70% 100%,30% 100%,0 35%);z-index:3}.arm{position:absolute;top:76px;width:14px;height:34px;background:#f7fbff;border:3px solid #51445d;border-radius:8px}.arm.l{left:15px;transform:rotate(8deg)}.arm.r{right:15px;transform:rotate(-8deg)}.leg{position:absolute;top:109px;width:16px;height:26px;background:#35435e;border:3px solid #4a334a}.leg.l{left:34px}.leg.r{right:34px}.shoe{position:absolute;bottom:1px;width:25px;height:9px;background:#fff;border:3px solid #4b3447;border-radius:4px}.shoe.l{left:25px}.shoe.r{right:25px}.intro-layout{height:calc(100% - 34px);position:relative;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:54px}.speech{align-self:flex-end;width:230px;background:#ffe8ef;border:4px solid #fff5f8;color:#a85279;padding:13px 12px;margin:0 4px 22px 0;font:9px/1.8 'Press Start 2P',monospace;text-align:center;box-shadow:0 7px 0 #b85d8c;border-radius:5px}.intro-boy{display:flex;align-items:flex-end;gap:20px}.gifts-layout{height:calc(100% - 34px);position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-bottom:34px}.choose{font:15px/1.7 'Press Start 2P',monospace;color:#ffc0d8;text-align:center;text-shadow:2px 2px 0 #85436e}.gifts{display:flex;gap:14px}.gift{border:0;background:none;padding:0;cursor:pointer}.box{width:82px;height:86px;position:relative}.base{position:absolute;left:8px;bottom:0;width:66px;height:52px;background:#ffe0b4;border:4px solid #553345;border-radius:4px;box-shadow:0 7px 0 #8b4c69}.base:after{content:'♥';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#f06b9d;font-size:20px}.lid{position:absolute;left:3px;top:20px;width:76px;height:19px;background:#ff87b1;border:4px solid #553345;border-radius:4px;z-index:2}.lid:before,.lid:after{content:'';position:absolute;top:-15px;width:20px;height:18px;background:#ffd951;border:4px solid #553345;border-radius:50% 50% 10% 50%}.lid:before{left:12px;transform:rotate(-35deg)}.lid:after{right:12px;transform:scaleX(-1) rotate(-35deg)}.label{font:7px 'Press Start 2P',monospace;color:#fff;text-align:center;margin-top:9px;text-shadow:1px 1px #633857}.overlay{position:fixed;inset:0;background:#1a0c20b8;backdrop-filter:blur(5px);display:grid;place-items:center;padding:15px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.overlay.show{opacity:1;pointer-events:auto}.modal{position:relative;width:min(390px,100%)}.close{position:absolute;right:4px;top:-8px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#7a4566;font-size:24px;z-index:4}.letterScene{height:430px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(#ff9abd,#ff72a8)}.env{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(320px,86vw);height:220px;animation:zoom .6s ease}.eback,.efront,.flap,.paper{position:absolute;left:50%;transform:translateX(-50%)}.eback{bottom:0;width:100%;height:170px;background:#f3eef7;border:5px solid #463345}.efront{bottom:0;width:100%;height:125px;background:#eae4ef;border:5px solid #463345;clip-path:polygon(0 0,50% 65%,100% 0,100% 100%,0 100%);z-index:3}.flap{top:36px;width:100%;height:112px;background:#f5eff9;border-top:5px solid #463345;clip-path:polygon(0 0,50% 100%,100% 0);z-index:4;transform-origin:top center;animation:open .8s .5s ease forwards}.seal{position:absolute;z-index:6;left:50%;top:90px;transform:translateX(-50%);font-size:52px}.paper{top:76px;width:84%;min-height:270px;background:#fffafa;border:4px solid #70455c;padding:18px;color:#7f526a;z-index:2;transform:translateX(-50%) translateY(110px);animation:up .8s 1s ease forwards;overflow:auto}.paper h3{font:10px/1.6 'Press Start 2P',monospace;text-align:center;color:#b55b87}.paper p{text-align:center;font-weight:700;line-height:1.6}.tag{text-align:center;font:7px 'Press Start 2P',monospace;color:#c66891;margin-bottom:10px}@keyframes zoom{from{opacity:0;transform:translateX(-50%) scale(.72) translateY(25px)}}@keyframes open{to{transform:translateX(-50%) rotateX(180deg) translateY(-8px)}}@keyframes up{to{transform:translateX(-50%) translateY(-24px)}}@media(min-width:431px){.app{height:min(900px,100dvh)}}</style></head><body><div class="app"><main class="game"><section class="screen active" id="s1"><div class="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hud"><div class="life"><i class="ph"></i><i class="ph off"></i><i class="ph off"></i></div><button class="pixbtn" id="skip">»</button></div><div class="start-layout"><div class="toprow"><div class="boy"><div class="hairback"></div><div class="curl u1"></div><div class="curl u2"></div><div class="curl u3"></div><div class="curl u4"></div><div class="curl u5"></div><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="smile"></i></div><div class="fringe"><i></i><i></i><i></i></div><div class="torso"></div><div class="tie"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div></div><div class="title"><small>A LITTLE GIFT</small>JUST FOR<br>YOU !</div></div><button class="startbtn" id="start">START</button></div><div class="note">made with love ♡</div></section><section class="screen" id="s2"><div class="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hud"><div class="life"><i class="ph"></i><i class="ph off"></i><i class="ph off"></i></div><button class="pixbtn" id="next">➜</button></div><div class="intro-layout"><div class="speech">hi love,<br>i prepared this gift<br>just for you</div><div class="intro-boy"><div class="boy big"><div class="hairback"></div><div class="curl u1"></div><div class="curl u2"></div><div class="curl u3"></div><div class="curl u4"></div><div class="curl u5"></div><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="smile"></i></div><div class="fringe"><i></i><i></i><i></i></div><div class="torso"></div><div class="tie"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div></div></div></div></section><section class="screen" id="s3"><div class="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hud"><button class="pixbtn" id="back">«</button><span></span></div><div class="gifts-layout"><div class="choose">CHOOSE YOUR<br>GIFTS</div><div class="gifts"><button class="gift" data-k="letter"><div class="box"><div class="lid"></div><div class="base"></div></div><div class="label">LETTER</div></button><button class="gift" data-k="song"><div class="box"><div class="lid"></div><div class="base" style="background:#ffd5e2"></div></div><div class="label">SONG</div></button><button class="gift" data-k="memory"><div class="box"><div class="lid"></div><div class="base" style="background:#d8f0e5"></div></div><div class="label">MEMORY</div></button></div></div><div class="note">tap a gift to open it ✨</div></section></main></div><div class="overlay" id="ov"><div class="modal"><button class="close" id="x">×</button><div class="letterScene" id="scene"></div></div></div><script>const S=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];function go(n){S.forEach((s,i)=>s.classList.toggle('active',i===n))}start.onclick=()=>go(1);next.onclick=()=>go(2);skip.onclick=()=>go(2);back.onclick=()=>go(1);const D={letter:['SWEET LETTER','this is a temporary message for the first design preview.','later we will replace it with your real letter.'],song:['OUR SONG','this gift can become the music section.','we can add the song and a tiny note.'],memory:['TINY MEMORY','this gift can hold a memory, a date, or an inside joke.','same vibe, different feeling.']};document.querySelectorAll('.gift').forEach(b=>b.onclick=()=>{let d=D[b.dataset.k];scene.innerHTML=`<div class="env"><div class="eback"></div><div class="paper"><div class="tag">FOR YOU ♡</div><h3>${d[0]}</h3><p>${d[1]}</p><p>${d[2]}</p></div><div class="flap"></div><div class="efront"></div><div class="seal">💗</div></div>`;ov.classList.add('show')});function shut(){ov.classList.remove('show');setTimeout(()=>{if(!ov.classList.contains('show'))scene.innerHTML=''},200)}x.onclick=shut;ov.onclick=e=>{if(e.target===ov)shut()};</script></body></html>
