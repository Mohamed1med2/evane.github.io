<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d6a1c4" />
  <title>For You ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="stage active" id="screen-1" aria-label="Password page">
      <img src="assets/screens/screen1.avif" alt="Guess the password" class="bg" draggable="false" />
      <div class="passcode-display" aria-hidden="true">
        <span class="code-box" id="digit-0"></span>
        <span class="code-box" id="digit-1"></span>
        <span class="code-box" id="digit-2"></span>
        <span class="code-box" id="digit-3"></span>
      </div>
      <div class="keypad" aria-label="Password keypad">
        <button class="key" data-key="1" aria-label="1"></button>
        <button class="key" data-key="2" aria-label="2"></button>
        <button class="key" data-key="3" aria-label="3"></button>
        <button class="key" data-key="4" aria-label="4"></button>
        <button class="key" data-key="5" aria-label="5"></button>
        <button class="key" data-key="6" aria-label="6"></button>
        <button class="key" data-key="7" aria-label="7"></button>
        <button class="key" data-key="8" aria-label="8"></button>
        <button class="key" data-key="9" aria-label="9"></button>
        <button class="key" data-action="clear" aria-label="Clear"></button>
        <button class="key" data-key="0" aria-label="0"></button>
        <button class="key" data-action="back" aria-label="Backspace"></button>
      </div>
    </section>

    <section class="stage" id="screen-2" aria-label="Wrong password">
      <img src="assets/screens/screen2.avif" alt="You are not my sweetheart. Please leave this website right now." class="bg" draggable="false" />
      <button class="hotspot ok-btn" data-go="1" aria-label="OK"></button>
    </section>

    <section class="stage" id="screen-3" aria-label="Welcome">
      <img src="assets/screens/screen3.avif" alt="Hey baby, welcome to my little surprise" class="bg" draggable="false" />
      <button class="hotspot start-btn" data-go="4" aria-label="Start"></button>
    </section>

    <section class="stage" id="screen-4" aria-label="Love note">
      <img src="assets/screens/screen4.avif" alt="Hi love, I made this little website just for you" class="bg" draggable="false" />
      <button class="hotspot next-btn" data-go="5" aria-label="Next"></button>
    </section>

    <section class="stage" id="screen-5" aria-label="Choose your gift">
      <img src="assets/screens/screen5.avif" alt="Choose your gift" class="bg" draggable="false" />
      <button class="hotspot gift gift-1" data-go="6" aria-label="A letter"></button>
      <button class="hotspot gift gift-2" data-go="6" aria-label="A song"></button>
      <button class="hotspot gift gift-3" data-go="6" aria-label="A memory"></button>
    </section>

    <section class="stage" id="screen-6" aria-label="A little message">
      <img src="assets/screens/screen6.avif" alt="A little message just for you" class="bg" draggable="false" />
      <button class="hotspot envelope-btn" data-go="7" aria-label="Open the message"></button>
    </section>

    <section class="stage" id="screen-7" aria-label="Thank you">
      <img src="assets/screens/screen7.avif" alt="Thank you for being here" class="bg" draggable="false" />
      <button class="hotspot home-btn" data-go="3" aria-label="Back home"></button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
