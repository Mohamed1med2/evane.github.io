<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7adc7"><title>For You ♡</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}body{background:#160d1d;display:grid;place-items:center;font-family:Nunito,Arial,sans-serif;color:#633b55}button{font:inherit}.app{position:relative;width:min(100vw,430px);height:100dvh;overflow:hidden;background:#f6bad0}.screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transform:translateX(18px);transition:.28s ease;padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.screen.active{opacity:1;pointer-events:auto;transform:none}.pink{background:linear-gradient(#f8b4cc,#f8cada 48%,#f7b8d0)}.lav{background:linear-gradient(#c8b6db,#cab8df 42%,#eab5d2)}.rose{background:linear-gradient(#f7b1ca,#f7c3d4 52%,#eeb0cf)}.letterbg{background:linear-gradient(#bea3ca,#dcb2d1 44%,#e5b4d0)}.night{background:linear-gradient(#31416e,#44547e 55%,#5d6891);color:#fff}.decor{position:absolute;inset:0;pointer-events:none}.cloud{position:absolute;background:#fff4f8;border-radius:999px;opacity:.78}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.c1{width:120px;height:28px;left:-18px;top:160px}.c1:before{width:45px;height:45px;left:20px;top:-18px}.c1:after{width:60px;height:60px;left:55px;top:-30px}.c2{width:150px;height:32px;right:-35px;bottom:110px}.c2:before{width:46px;height:46px;left:18px;top:-20px}.c2:after{width:68px;height:68px;left:56px;top:-36px}.heart{position:absolute;color:#ef6c9a;font-size:28px;filter:drop-shadow(0 3px 0 #fff7)}.h1{left:6%;top:32%}.h2{right:8%;top:45%}.h3{left:18%;bottom:22%}.spark{position:absolute;color:#fff7fb;font:13px 'Press Start 2P'}.s1{left:9%;top:12%}.s2{right:12%;top:18%}.s3{left:14%;top:42%}.topbar{position:relative;z-index:7;height:35px;display:flex;align-items:center;justify-content:space-between;font:9px 'Press Start 2P';color:#7b425f}.night .topbar{color:#fff}.back{border:0;background:none;font-size:34px;line-height:1;color:inherit;cursor:pointer;padding:0 6px}.step{font:9px 'Press Start 2P'}.content{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;padding-top:26px}.content h1{font:clamp(28px,8vw,40px)/1.22 'Press Start 2P';margin:10px 0 12px;color:#8f2e58;text-shadow:0 4px 0 #fff7;text-align:center}.sub{text-align:center;font-size:17px;line-height:1.55;color:#86546b}.sprite{position:absolute;display:block;object-fit:contain;user-select:none;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;filter:drop-shadow(0 6px 0 rgba(133,80,107,.12));animation:none!important;transition:none!important}.p1{width:240px;max-width:64vw;bottom:120px;left:0;right:0;margin:auto}.p2{width:240px;max-width:66vw;left:0;right:0;margin:auto;bottom:84px}.p3{width:210px;max-width:54vw;left:0;right:0;margin:auto;bottom:-2px}.p4{width:210px;max-width:54vw;left:0;right:0;margin:auto;top:-3px;z-index:7}.p5{width:240px;max-width:66vw;left:0;right:0;margin:auto;bottom:112px}.start,.arrow,.home{border:3px solid #a54570;background:#f586ad;color:#fff;cursor:pointer;box-shadow:0 5px 0 #bc507d}.start{position:absolute;z-index:8;left:26px;right:26px;bottom:56px;height:62px;border-radius:22px;font:15px 'Press Start 2P'}.made{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:#9a5a76}.speech{position:relative;z-index:5;margin:52px auto 0;width:min(92%,340px);padding:20px 17px;background:#fff6f8;border:3px solid #8a4d69;border-radius:24px;text-align:center;font-size:18px;line-height:1.55;box-shadow:0 7px 0 #fff7}.arrow{position:absolute;right:22px;bottom:26px;width:58px;height:58px;border-radius:18px;font-size:30px;z-index:9}.choose{position:relative;z-index:5;margin:36px auto 18px;text-align:center;font:22px/1.45 'Press Start 2P';color:#7b3254}.giftgrid{position:relative;z-index:6;margin:5px auto 0;width:min(92%,360px);display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.giftbtn{border:0;background:none;cursor:pointer;color:#75425c;font-weight:800}.giftbtn.first{grid-column:1/3;justify-self:center;width:150px}.box{position:relative;margin:auto;width:108px;height:92px}.base{position:absolute;left:8px;right:8px;bottom:0;height:63px;border:4px solid #6b3d54;border-radius:8px;background:#f8a9c2;box-shadow:0 6px 0 #b55b7d}.blue .base{background:#9ba9ea}.beige .base{background:#dbb091}.lid{position:absolute;left:2px;right:2px;top:16px;height:27px;border:4px solid #6b3d54;border-radius:8px;background:#ef7da6}.blue .lid{background:#8797dd}.beige .lid{background:#c99c7c}.bow:before,.bow:after{content:"";position:absolute;top:0;width:32px;height:27px;border:4px solid #6b3d54;background:#f7a0ba;border-radius:70% 70% 10% 70%}.bow:before{left:24px;transform:rotate(-28deg)}.bow:after{right:24px;transform:scaleX(-1) rotate(-28deg)}.blue .bow:before,.blue .bow:after{background:#8797dd}.beige .bow:before,.beige .bow:after{background:#c99c7c}.base:after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:#db688f}.giftlbl{margin-top:8px;font-size:16px}.pick{position:absolute;right:17px;bottom:118px;z-index:8;background:#fff7fa;border:3px solid #8d4b68;border-radius:18px;padding:10px 12px;font:9px/1.5 'Press Start 2P';text-align:center;color:#76415c}.letterwrap{position:relative;z-index:5;flex:1;display:flex;align-items:center;justify-content:center;padding-top:40px}.envelope{position:relative;width:min(88vw,360px);height:330px;cursor:pointer}.eback{position:absolute;left:0;right:0;bottom:0;height:230px;background:#f6e5ea;border:4px solid #8d536d;border-radius:8px}.paper{position:absolute;left:8%;right:8%;bottom:74px;height:260px;background:#fff9fa;border:4px solid #8d536d;border-radius:10px;padding:110px 22px 18px;text-align:center;color:#7b4560;transition:.5s ease;overflow:auto}.paper.open{bottom:150px}.paper h3{margin:0 0 10px;font-size:20px}.paper p{font-size:16px;line-height:1.55;margin:8px 0}.efront{position:absolute;left:0;right:0;bottom:0;height:170px;background:#efdce4;border:4px solid #8d536d;clip-path:polygon(0 0,50% 65%,100% 0,100% 100%,0 100%);z-index:3}.seal{position:absolute;z-index:6;left:50%;bottom:92px;transform:translateX(-50%);font-size:68px}.tap{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#7c5064;font-size:15px;z-index:8}.continue{display:none}.continue.show{display:block}.moon{position:absolute;left:28px;top:70px;width:64px;height:64px;border-radius:50%;background:#ffe2a7;box-shadow:18px 0 0 #354872}.nighttitle{position:relative;z-index:5;margin-top:105px;text-align:center;font:20px/1.7 'Press Start 2P'}.nightsub{position:relative;z-index:5;text-align:center;margin-top:10px;font-size:17px;color:#e6e3f1}.home{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);width:220px;height:58px;border-radius:18px;background:#f9e3ea;color:#71425a;font:10px 'Press Start 2P'}@media(max-height:720px){.p1{width:200px;bottom:104px}.content h1{font-size:28px}.p2{width:200px;bottom:65px}.speech{margin-top:30px}.p3,.p4{width:176px}.p5{width:200px;bottom:100px}}</style></head><body><div class="app"><section class="screen pink active" id="s1"><div class="decor"><span class="cloud c1"></span><span class="cloud c2"></span><span class="spark s1">✦</span><span class="heart h1">♥</span><span class="heart h2">♥</span><span class="heart h3">♥</span></div><div class="topbar"><span>19:45</span><span>♡</span></div><div class="content"><h1>hey,baby!</h1><div class="sub">welcome to my<br>little surprise ♡</div></div><img class="sprite p1" src="assets/pose1.svg"><button class="start" id="start">start&nbsp;&nbsp;→</button><div class="made">made with love ♡</div></section><section class="screen lav" id="s2"><div class="decor"><span class="cloud c1"></span><span class="cloud c2"></span><span class="spark s2">✧</span></div><div class="topbar"><button class="back" id="b1">‹</button><span class="step">2/5</span></div><div class="speech">hi love,<br>i made this little<br>website just for you ♡</div><img class="sprite p2" src="assets/pose2.svg"><button class="arrow" id="next2">→</button></section><section class="screen rose" id="s3"><div class="topbar"><button class="back" id="b2">‹</button><span class="step">3/5</span></div><div class="choose">choose<br>your gift !</div><div class="giftgrid"><button class="giftbtn first" data-kind="letter"><div class="box"><div class="bow"></div><div class="lid"></div><div class="base"></div></div><div class="giftlbl">a letter</div></button><button class="giftbtn blue" data-kind="song"><div class="box"><div class="bow"></div><div class="lid"></div><div class="base"></div></div><div class="giftlbl">a song</div></button><button class="giftbtn beige" data-kind="memory"><div class="box"><div class="bow"></div><div class="lid"></div><div class="base"></div></div><div class="giftlbl">a memory</div></button></div><img class="sprite p3" src="assets/pose3.svg"><div class="pick">pick<br>one ! ♡</div></section><section class="screen letterbg" id="s4"><div class="topbar"><button class="back" id="b3">‹</button><span class="step">4/5</span></div><div class="letterwrap"><div class="envelope" id="env"><div class="eback"></div><div class="paper" id="paper"><h3 id="mtitle">a little message</h3><p id="m1">just for you...</p><p id="m2"></p></div><div class="efront"></div><div class="seal">💗</div><img class="sprite p4" src="assets/pose4.svg"></div></div><div class="tap" id="tap">tap to open ♡</div><button class="arrow continue" id="to5">→</button></section><section class="screen night" id="s5"><div class="topbar"><button class="back" id="b4">‹</button><span class="step">5/5</span></div><div class="moon"></div><div class="nighttitle">thank you<br>for being here ♡</div><div class="nightsub">you make everything<br>more special.</div><img class="sprite p5" src="assets/pose5.svg"><button class="home" id="home">⌂&nbsp; back home</button></section></div><script>const screens=[s1,s2,s3,s4,s5];function go(i){screens.forEach((s,n)=>s.classList.toggle('active',n===i));if(i!==3){paper.classList.remove('open');to5.classList.remove('show');tap.textContent='tap to open ♡'}}start.onclick=()=>go(1);b1.onclick=()=>go(0);next2.onclick=()=>go(2);b2.onclick=()=>go(1);b3.onclick=()=>go(2);b4.onclick=()=>go(3);home.onclick=()=>go(0);const msgs={letter:['a little message','just for you...','this is where your real letter will go ♡'],song:['our song','something that feels like us...','we can add the real song here later ♫'],memory:['a tiny memory','one little moment...','a special memory can live here forever ♡']};document.querySelectorAll('.giftbtn').forEach(b=>b.onclick=()=>{const d=msgs[b.dataset.kind];mtitle.textContent=d[0];m1.textContent=d[1];m2.textContent=d[2];go(3)});env.onclick=()=>{paper.classList.add('open');to5.classList.add('show');tap.textContent='opened with love ♡'};to5.onclick=()=>go(4);</script></body></html>
